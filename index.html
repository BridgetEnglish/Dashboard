<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacant Jobs Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F2EE;
    --surface: #FFFFFF;
    --surface2: #EEECE8;
    --border: #D8D5CF;
    --border-light: #E8E6E1;
    --text: #1A1916;
    --text-muted: #6B6860;
    --text-faint: #9E9B94;
    --accent: #1D6A4A;
    --accent-light: #E1F0E9;
    --accent-text: #0F3D29;
    --amber: #92580A;
    --amber-light: #FDF3E0;
    --blue: #1A4F8A;
    --blue-light: #E5EEF8;
    --red: #8A1A1A;
    --red-light: #F8E5E5;
    --grey: #8B8984;
    --grey-light: #F5F4F1;
    --new-highlight: #E6F4EE;
    --radius: 8px;
    --radius-lg: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  .app { max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }
  .tab {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 20px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab:hover { color: var(--text); background: var(--grey-light); }
  .tab.active {
    color: var(--accent-text);
    border-bottom-color: var(--accent);
  }
  .tab .count {
    display: inline-block;
    margin-left: 6px;
    padding: 2px 8px;
    background: var(--surface2);
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
  }
  .tab.active .count { background: var(--accent-light); color: var(--accent-text); }

  /* ── Header ── */
  .app-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 2rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
    gap: 1rem;
    flex-wrap: wrap;
  }
  .app-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--text);
  }
  .app-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* ── Metrics ── */
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .metric {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
  }
  .metric-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .metric-value {
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
    font-family: 'DM Mono', monospace;
  }
  .metric-sub {
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 4px;
  }
  .metric.lost { border-color: var(--red); background: var(--red-light); }
  .metric.lost .metric-value { color: var(--red); }

  /* ── Buttons ── */
  .btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--surface2); border-color: var(--text-muted); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: var(--accent-text); border-color: var(--accent-text); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-icon {
    padding: 4px 10px;
    font-size: 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-icon:hover { background: var(--surface2); color: var(--text); }
  .btn-close {
    background: var(--grey-light);
    border-color: var(--grey);
    color: var(--grey);
  }
  .btn-close:hover { background: var(--grey); color: white; }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border-light); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    padding: 12px 14px;
    font-weight: 500;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border-light);
    background: var(--surface2);
    white-space: nowrap;
  }
  td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-light);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  .new-row { background: var(--new-highlight); animation: highlight 2s ease-out; }
  @keyframes highlight { from { background: var(--accent-light); } to { background: transparent; } }
  .closed-row {
    opacity: 0.5;
    background: var(--grey-light);
  }
  .closed-row .facility-name,
  .closed-row .ward-name { text-decoration: line-through; }

  .facility-name { font-weight: 500; color: var(--text); }
  .ward-name { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-faint);
  }
  .empty-icon { font-size: 48px; margin-bottom: 1rem; opacity: 0.3; }
  .empty-text { font-size: 16px; font-weight: 500; margin-bottom: 0.5rem; }
  .empty-sub { font-size: 13px; }

  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
  }
  .badge-green { background: var(--accent-light); color: var(--accent-text); }
  .badge-blue { background: var(--blue-light); color: var(--blue); }
  .badge-amber { background: var(--amber-light); color: var(--amber); }

  .rate-wrap {
    display: flex;
    align-items: center;
    gap: 2px;
    font-family: 'DM Mono', monospace;
  }
  .rate-prefix { font-size: 13px; color: var(--text-muted); }
  .rate-input {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    width: 80px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    text-align: right;
  }
  .rate-input:focus { outline: none; border-color: var(--accent); }

  .fte-input {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    width: 50px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    text-align: center;
  }
  .fte-input:focus { outline: none; border-color: var(--accent); }

  .contract-value {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    color: var(--accent-text);
  }
  .contract-value.zero { color: var(--text-faint); }

  /* ── Parser Panel ── */
  .parse-section {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    margin-bottom: 2rem;
    overflow: hidden;
  }
  .parse-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
    cursor: pointer;
    background: var(--surface2);
    transition: background 0.2s;
  }
  .parse-header:hover { background: var(--border-light); }
  .parse-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }
  .parse-chevron {
    font-size: 14px;
    color: var(--text-muted);
    transition: transform 0.2s;
  }
  .parse-panel {
    padding: 1.25rem;
    display: none;
  }
  .parse-panel.open { display: block; }
  .email-input {
    width: 100%;
    min-height: 150px;
    padding: 12px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    resize: vertical;
    margin-bottom: 12px;
  }
  .email-input:focus { outline: none; border-color: var(--accent); }
  .status-text {
    font-size: 13px;
    padding: 8px 12px;
    border-radius: var(--radius);
    margin-bottom: 12px;
  }
  .status-text.success { background: var(--accent-light); color: var(--accent-text); }
  .status-text.error { background: var(--red-light); color: var(--red); }
  .status-text.loading { background: var(--blue-light); color: var(--blue); }
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--blue);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="app-header">
    <div>
      <div class="app-title">Vacant Jobs Dashboard</div>
      <div class="app-subtitle">Track and value healthcare placement opportunities</div>
    </div>
    <div class="header-actions">
      <button class="btn" id="btn-export">Export CSV</button>
    </div>
  </div>

  <!-- Parser -->
  <div class="parse-section">
    <div class="parse-header" id="parse-header-toggle">
      <div class="parse-title">📧 Parse Email</div>
      <span class="parse-chevron" id="parse-chevron">▼</span>
    </div>
    <div class="parse-panel" id="parse-panel">
      <textarea class="email-input" id="email-input" placeholder="Paste job vacancy email here..."></textarea>
      <div id="status-area"></div>
      <button class="btn btn-primary" id="btn-parse">Parse & add to dashboard</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="active">
      Active Jobs <span class="count" id="count-active">0</span>
    </button>
    <button class="tab" data-tab="closed">
      Closed <span class="count" id="count-closed">0</span>
    </button>
  </div>

  <!-- Metrics -->
  <div class="metrics" id="metrics-area"></div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Facility</th>
          <th>Job title</th>
          <th>Location</th>
          <th>Rate band</th>
          <th style="text-align:center;">FTE</th>
          <th>Start date</th>
          <th>Length</th>
          <th>Hourly rate</th>
          <th>Contract value</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="jobs-tbody">
        <tr><td colspan="10"><div class="empty-state">
          <div class="empty-icon">📋</div>
          <div class="empty-text">No vacancies yet</div>
          <div class="empty-sub">Click "Parse email" above to add your first placement</div>
        </div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
// ── Data ────────────────────────────────────────────────
const ANTHROPIC_API_KEY = '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';

let jobs = [
  { id:1, facility:"Alice Springs Hospital", title:"Midwife", ward:"Maternity", location:"Alice Springs, NT", band:"Midwife", fte:3, hourlyRate:52.33, weeks:6, startDate:"19/01/2026", closed:false },
  { id:2, facility:"Alice Springs Hospital", title:"RN – Neonatal", ward:"Neonatal", location:"Alice Springs, NT", band:"RN – Neonatal", fte:2, hourlyRate:52.33, weeks:6, startDate:"19/01/2026", closed:false },
  { id:3, facility:"Alice Springs Hospital", title:"RN – Medical/Surgical", ward:"Medical West", location:"Alice Springs, NT", band:"RN – Gen Med/Surg", fte:4, hourlyRate:52.33, weeks:6, startDate:"19/01/2026", closed:false },
  { id:4, facility:"Mackay Base Hospital", title:"Registered Nurse", ward:"Emergency Dept", location:"Mackay, QLD", band:"RN Grade 5", fte:10, hourlyRate:52.33, weeks:5, startDate:"20/01/2026", closed:false },
  { id:5, facility:"Mackay Base Hospital", title:"Registered Nurse", ward:"Medical G2 Ward", location:"Mackay, QLD", band:"RN Grade 5", fte:1, hourlyRate:52.33, weeks:4, startDate:"27/01/2026", closed:false },
  { id:6, facility:"North West HHS", title:"Mental Health Clinician", ward:"CYMHS", location:"Mount Isa, QLD", band:"CNC NG6 / HP3", fte:1, hourlyRate:68.27, weeks:4, startDate:"19/01/2026", closed:false },
  { id:7, facility:"Mackay Base Hospital", title:"Registered Midwife", ward:"Women's Health", location:"Mackay, QLD", band:"Midwife Grade 5", fte:1, hourlyRate:52.33, weeks:6, startDate:"03/02/2026", closed:false }
];
let nextId = 8;
let newIds = new Set();
let currentTab = 'active';

// ── Helpers ─────────────────────────────────────────────
function esc(str) { return (str||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMoney(num) { return '$' + Math.round(num).toLocaleString(); }
function contractValue(j) {
  if (!j.hourlyRate || !j.weeks || !j.fte) return 0;
  return j.hourlyRate * 40 * j.weeks * 1.20 * j.fte;
}
function setStatus(msg, type) {
  const area = document.getElementById('status-area');
  if (!msg) { area.innerHTML = ''; return; }
  area.innerHTML = `<div class="status-text ${type}">${msg}</div>`;
}

// ── Render ──────────────────────────────────────────────
function render() {
  const activeJobs = jobs.filter(j => !j.closed);
  const closedJobs = jobs.filter(j => j.closed);
  
  const displayJobs = currentTab === 'active' ? activeJobs : closedJobs;
  
  // Update counts
  document.getElementById('count-active').textContent = activeJobs.length;
  document.getElementById('count-closed').textContent = closedJobs.length;
  
  // Render metrics
  renderMetrics(activeJobs, closedJobs);
  
  // Render table
  const tbody = document.getElementById('jobs-tbody');
  if (displayJobs.length === 0) {
    const emptyMsg = currentTab === 'active' 
      ? 'No active vacancies'
      : 'No closed jobs yet';
    tbody.innerHTML = `<tr><td colspan="10"><div class="empty-state">
      <div class="empty-icon">📋</div>
      <div class="empty-text">${emptyMsg}</div>
    </div></td></tr>`;
  } else {
    const sorted = [...displayJobs].sort((a,b) => contractValue(b) - contractValue(a));
    tbody.innerHTML = sorted.map(j => {
      const val = contractValue(j);
      const isNew = newIds.has(j.id);
      const badgeClass = j.weeks <= 4 ? 'badge-amber' : j.weeks <= 12 ? 'badge-blue' : 'badge-green';
      const contractLen = j.weeks ? `${j.weeks}w / ${(j.weeks * 40).toLocaleString()}hrs` : '—';
      const rowClass = j.closed ? 'closed-row' : (isNew ? 'new-row' : '');
      
      return `<tr class="${rowClass}">
        <td>
          <div class="facility-name">${esc(j.facility)}</div>
          <div class="ward-name">${esc(j.ward)}</div>
        </td>
        <td>${esc(j.title)}</td>
        <td>${esc(j.location)}</td>
        <td>${esc(j.band)}</td>
        <td style="text-align:center;">
          <input class="fte-input" type="number" min="1" step="1" 
            value="${j.fte}" 
            onchange="updateFTE(${j.id}, this.value)" />
        </td>
        <td style="font-family:'DM Mono',monospace;font-size:12px;">${esc(j.startDate||'—')}</td>
        <td><span class="badge ${badgeClass}">${contractLen}</span></td>
        <td>
          <div class="rate-wrap">
            <span class="rate-prefix">$</span>
            <input class="rate-input" type="number" min="0" step="1" placeholder="0"
              value="${j.hourlyRate || ''}"
              onchange="updateRate(${j.id}, this.value)" />
          </div>
        </td>
        <td><span class="contract-value${val===0?' zero':''}">${fmtMoney(val)}</span></td>
        <td>
          <button class="btn-icon ${j.closed ? '' : 'btn-close'}" 
            onclick="toggleClosed(${j.id})" 
            title="${j.closed ? 'Reopen' : 'Mark as closed'}">
            ${j.closed ? 'Reopen' : 'Closed'}
          </button>
        </td>
      </tr>`;
    }).join('');
  }
}

function renderMetrics(activeJobs, closedJobs) {
  const totalFTE = activeJobs.reduce((sum, j) => sum + j.fte, 0);
  const totalValue = activeJobs.reduce((sum, j) => sum + contractValue(j), 0);
  const lostValue = closedJobs.reduce((sum, j) => sum + contractValue(j), 0);
  
  const metricsHTML = currentTab === 'active' 
    ? `
      <div class="metric">
        <div class="metric-label">Active Roles</div>
        <div class="metric-value">${activeJobs.length}</div>
        <div class="metric-sub">${totalFTE} FTE total</div>
      </div>
      <div class="metric">
        <div class="metric-label">Total Value</div>
        <div class="metric-value">${fmtMoney(totalValue)}</div>
        <div class="metric-sub">Active pipeline</div>
      </div>
      <div class="metric lost">
        <div class="metric-label">Lost Revenue</div>
        <div class="metric-value">${fmtMoney(lostValue)}</div>
        <div class="metric-sub">${closedJobs.length} closed roles</div>
      </div>
    `
    : `
      <div class="metric">
        <div class="metric-label">Closed Roles</div>
        <div class="metric-value">${closedJobs.length}</div>
        <div class="metric-sub">No longer active</div>
      </div>
      <div class="metric lost">
        <div class="metric-label">Lost Revenue</div>
        <div class="metric-value">${fmtMoney(lostValue)}</div>
        <div class="metric-sub">From closed roles</div>
      </div>
    `;
  
  document.getElementById('metrics-area').innerHTML = metricsHTML;
}

// ── Actions ─────────────────────────────────────────────
function toggleClosed(id) {
  const job = jobs.find(j => j.id === id);
  if (job) {
    job.closed = !job.closed;
    newIds.delete(id);
    render();
  }
}

function updateFTE(id, value) {
  const job = jobs.find(j => j.id === id);
  if (job) {
    job.fte = Math.max(1, parseInt(value) || 1);
    render();
  }
}

function updateRate(id, value) {
  const job = jobs.find(j => j.id === id);
  if (job) {
    job.hourlyRate = parseFloat(value) || 0;
    render();
  }
}

function toggleParser() {
  const panel = document.getElementById('parse-panel');
  const chevron = document.getElementById('parse-chevron');
  const isOpen = panel.classList.contains('open');
  if (isOpen) {
    panel.classList.remove('open');
    chevron.textContent = '▼';
  } else {
    panel.classList.add('open');
    chevron.textContent = '▲';
  }
}

async function parseEmail() {
  const emailText = document.getElementById('email-input').value.trim();
  if (!emailText) {
    setStatus('Please paste an email first.', 'error');
    return;
  }

  setStatus('<span class="spinner"></span> Parsing email…', 'loading');

  const systemPrompt = `You are a data extraction assistant for a healthcare staffing agency dashboard. 
Extract job placement details from healthcare job emails and return ONLY a valid JSON array.
Each object must have these exact fields:
- facility: string (hospital or health service name)
- title: string (job title e.g. "Registered Nurse", "Midwife", "Mental Health Clinician")
- ward: string (ward, unit, or team name)
- location: string (city and state e.g. "Mackay, QLD")
- band: string (grade/classification e.g. "RN Grade 5", "Midwife Grade 5", "CNC NG6")
- fte: number (number of placements/positions available)
- weeks: number (contract length in weeks, calculated from start/end dates if needed. Round to nearest whole week)
- startDate: string (contract start date in DD/MM/YYYY format, or "" if not found)

Rules:
- If multiple distinct roles are in the email, return one object per role.
- If dates are given, calculate weeks = ceil((end - start) / 7).
- CRITICAL: Return ONLY the raw JSON array. No markdown. No code fences. No explanation. Start with [ and end with ].`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': ANTHROPIC_API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: emailText }]
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    const raw = data.content.map(b => b.text || '').join('').trim();
    const clean = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);

    if (!Array.isArray(parsed) || parsed.length === 0) {
      throw new Error('No roles found in email.');
    }

    let added = 0;
    parsed.forEach(j => {
      const id = nextId++;
      newIds.add(id);
      jobs.push({
        id,
        facility: j.facility||'',
        title: j.title||'',
        ward: j.ward||'',
        location: j.location||'',
        band: j.band||'',
        fte: Number(j.fte)||1,
        hourlyRate: 0,
        weeks: Number(j.weeks)||0,
        startDate: j.startDate||'',
        closed: false
      });
      added++;
    });

    render();
    document.getElementById('email-input').value = '';
    setStatus(`✓ Added ${added} role${added>1?'s':''} to the dashboard.`, 'success');
    setTimeout(() => setStatus('', ''), 3000);
  } catch (err) {
    setStatus(`Error: ${err.message}`, 'error');
  }
}

function exportCSV() {
  const headers = ['Status','Facility','Ward','Job Title','Location','Rate Band','FTE','Start Date','Weeks','Contract Length (hrs)','Hourly Rate','Contract Value'];
  const rows = jobs.map(j => [
    j.closed ? 'Closed' : 'Active',
    j.facility,
    j.ward,
    j.title,
    j.location,
    j.band,
    j.fte,
    j.startDate||'',
    j.weeks,
    j.weeks*40,
    j.hourlyRate,
    Math.round(contractValue(j))
  ]);
  
  const csv = [headers, ...rows].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `vacant_jobs_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Events ──────────────────────────────────────────────
document.getElementById('parse-header-toggle').addEventListener('click', toggleParser);
document.getElementById('btn-parse').addEventListener('click', parseEmail);
document.getElementById('btn-export').addEventListener('click', exportCSV);

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    render();
  });
});

// ── Init ────────────────────────────────────────────────
render();
</script>
